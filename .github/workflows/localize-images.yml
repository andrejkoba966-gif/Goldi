name: Localize external images

# One-off migration: downloads the images still hosted on the old site and
# rewrites every reference to a local path under images/. Runs on GitHub's
# runners because the old domain is not reachable from the dev sandbox.
# Trigger manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would change, do not commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images and rewrite references
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, urllib.request

          # url suffix -> local filename
          MAP = {
            "storage/images/16159800818388.png":        "logo.png",
            "storage/cache/16164065468190-331x280.jpg": "armatura.jpg",
            "storage/cache/16164070478978-331x280.jpg": "truby.jpg",
            "storage/cache/16164073419473-331x280.jpg": "shveller.jpg",
            "storage/cache/16164074595700-331x280.jpg": "armatura-a240.jpg",
            "storage/cache/16164232718274-373x280.jpg": "vlasne-vyrobnytstvo.jpg",
            "storage/cache/16164056554856-373x280.jpg": "metaloprokat.jpg",
            "storage/cache/16164234031017-373x280.jpg": "budmaterialy.jpg",
            "storage/cache/16164085635247-597x296.jpg": "truba-bezshovna.jpg",
            "storage/cache/16164085949254-597x296.jpg": "truba-vgp.jpg",
            "storage/cache/16164086542397-597x296.jpg": "truba-profilna.jpg",
            "storage/cache/16164087255621-597x296.jpg": "truba-elektrozvaryuvalna.jpg",
            # armatura tiles, in the order the old section page renders them
            "storage/cache/16164079081311-597x296.jpg": "arm-a240.jpg",
            "storage/cache/16164079923296-597x296.jpg": "arm-a400-gost.jpg",
            "storage/cache/16164080659031-597x296.jpg": "arm-a400-a500-dstu.jpg",
            "storage/cache/16164082034700-597x296.jpg": "arm-at800-at1000.jpg",
            "storage/cache/16164081497642-597x296.jpg": "arm-ndv.jpg",
          }
          BASE = "https://goldigroup.com.ua/"
          os.makedirs("images", exist_ok=True)

          # --- download, verifying each file is a real image -----------------
          MAGIC = {b"\x89PNG": "png", b"\xff\xd8\xff": "jpg", b"GIF8": "gif", b"RIFF": "webp"}
          failed = []
          for suffix, name in MAP.items():
              url = BASE + suffix
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=60).read()
              except Exception as e:
                  failed.append((url, repr(e)))
                  continue
              if not any(data.startswith(m) for m in MAGIC):
                  failed.append((url, "not an image (%d bytes)" % len(data)))
                  continue
              open(os.path.join("images", name), "wb").write(data)
              print("downloaded %-28s %7d bytes  <- %s" % (name, len(data), url))

          if failed:
              print("\nFAILED — nothing was rewritten:")
              for url, why in failed:
                  print("  %s  %s" % (url, why))
              sys.exit(1)

          # --- rewrite references -------------------------------------------
          EXTS = (".html", ".css", ".js", ".svg", ".json", ".md")
          changed = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "images", ".github")]
              for f in files:
                  if not f.endswith(EXTS):
                      continue
                  path = os.path.join(root, f)
                  src = open(path, encoding="utf-8").read()
                  out = src
                  # depth of this file relative to repo root -> ../ prefix
                  depth = len(os.path.normpath(os.path.dirname(path)).split(os.sep))
                  if os.path.normpath(os.path.dirname(path)) == ".":
                      depth = 0
                  prefix = "../" * depth
                  for suffix, name in MAP.items():
                      out = out.replace(BASE + suffix, prefix + "images/" + name)
                  if out != src:
                      open(path, "w", encoding="utf-8").write(out)
                      changed.append(path)

          leftover = subprocess.run(
              ["grep", "-rl", "goldigroup.com.ua/storage", "--include=*.html",
               "--include=*.css", "--include=*.js", "."],
              capture_output=True, text=True).stdout.strip()
          if leftover:
              print("\nFAILED — references left behind:\n" + leftover)
              sys.exit(1)

          print("\nrewrote %d files:" % len(changed))
          for p in sorted(changed):
              print("  " + p)
          PY

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images .
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -F - <<'MSG'
          Host the old site's images in this repo

          The logo and seven catalog photos were still loaded from
          goldigroup.com.ua, so the whole site would lose them if that domain
          goes away. They now live in images/ and every reference points there.
          MSG
          git push
