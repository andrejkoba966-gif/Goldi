name: Build for goldigroup.com.ua
# On every push to main: stamp the SEO block for the real domain and publish the
# result to the server-build branch. The server checks that branch every 5 minutes
# and installs a new build on its own, so no server password lives in this repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: server-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp SEO for the domain
        run: |
          pip install -q pillow
          SITE_BASE=https://goldigroup.com.ua/ python3 tools/seo.py
      - name: Publish to the server-build branch
        run: |
          SRC=$(git rev-parse --short HEAD)
          rm -rf /tmp/out && mkdir /tmp/out
          tar --exclude=.git --exclude=.github --exclude=tools -cf - . | tar -xf - -C /tmp/out
          echo "$SRC" > /tmp/out/.build-source
          cd /tmp/out
          git init -q -b server-build
          git config user.name "server-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Build of $SRC for goldigroup.com.ua"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" server-build
          echo "published build of $SRC"
