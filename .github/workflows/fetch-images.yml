name: Fetch images from the old site

# Downloads images from goldigroup.com.ua into images/ and commits them.
# Runs on GitHub's runners because the old domain is not reachable from the
# dev sandbox. Trigger manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated url-suffix=filename pairs, e.g. storage/images/123.jpg=cover.jpg"
        required: true
      dry_run:
        description: "Only report sizes, do not commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        env:
          PAIRS: ${{ inputs.pairs }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request, struct

          BASE = "https://goldigroup.com.ua/"
          MAGIC = {b"\x89PNG": "png", b"\xff\xd8\xff": "jpg", b"GIF8": "gif", b"RIFF": "webp"}
          os.makedirs("images", exist_ok=True)

          def jpeg_size(d):
              i = 2
              while i < len(d) - 9:
                  if d[i] != 0xFF:
                      i += 1; continue
                  m = d[i+1]
                  if m in (0xC0, 0xC1, 0xC2, 0xC3):
                      h, w = struct.unpack(">HH", d[i+5:i+9])
                      return w, h
                  if m in (0xD8, 0xD9) or 0xD0 <= m <= 0xD7:
                      i += 2; continue
                  i += 2 + struct.unpack(">H", d[i+2:i+4])[0]
              return None

          failed = []
          for part in os.environ["PAIRS"].split(","):
              part = part.strip()
              if not part:
                  continue
              suffix, _, name = part.partition("=")
              url = BASE + suffix.strip()
              name = name.strip()
              if not name:
                  failed.append((url, "no filename given")); continue
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(req, timeout=60).read()
              except Exception as e:
                  failed.append((url, repr(e))); continue
              if not any(data.startswith(m) for m in MAGIC):
                  failed.append((url, "not an image (%d bytes)" % len(data))); continue
              dims = jpeg_size(data) if data.startswith(b"\xff\xd8\xff") else None
              open(os.path.join("images", name), "wb").write(data)
              print("downloaded %-30s %8d bytes  %s  <- %s"
                    % (name, len(data), ("%dx%d" % dims) if dims else "?", url))

          if failed:
              print("\nFAILED — nothing was committed:")
              for url, why in failed:
                  print("  %s  %s" % (url, why))
              sys.exit(1)
          PY

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Fetch images from the old site"
          git push
